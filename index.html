 data-i="11"><img src="images/featherio.jpg" alt="行間の森" loading="lazy"><span class="meta"><span class="t">行間の森</span><span class="a">フェザリオ</span></span></button><button class="card" data-i="12"><img src="images/mira.jpg" alt="境目の木漏れ日" loading="lazy"><span class="meta"><span class="t">境目の木漏れ日</span><span class="a">ミラ</span></span></button><button class="card" data-i="13"><img src="images/lux.jpg" alt="群青の呼吸" loading="lazy"><span class="meta"><span class="t">群青の呼吸</span><span class="a">ルクス</span></span></button><button class="card" data-i="14"><img src="images/alice.jpg" alt="光の透ける森" loading="lazy"><span class="meta"><span class="t">光の透ける森</span><span class="a">アリス</span></span></button><button class="card" data-i="15"><img src="images/sona.jpg" alt="無音の森" loading="lazy"><span class="meta"><span class="t">無音の森</span><span class="a">ソナ</span></span></button><button class="card" data-i="16"><img src="images/kanata.png" alt="タメの森" loading="lazy"><span class="meta"><span class="t">タメの森</span><span class="a">カナタ</span></span></button><button class="card" data-i="17"><img src="images/signa.jpg" alt="信号の木立" loading="lazy"><span class="meta"><span class="t">信号の木立</span><span class="a">シグナ</span></span></button><button class="card" data-i="18"><img src="images/wizcraft.jpg" alt="ふたつのおかえり" loading="lazy"><span class="meta"><span class="t">ふたつのおかえり</span><span class="a">Wizcraft</span></span></button><button class="card" data-i="19"><img src="images/kota.png" alt="森的ブィィーン" loading="lazy"><span class="meta"><span class="t">森的ブィィーン</span><span class="a">黛公太</span></span></button></main>

<script>const ART=[{"id": "towa", "img": "images/towa.jpg", "title": "光の道", "author": "トワ", "caption": "苔むした木立のあいだに、やわらかい光の筋。答えのない小径を、息を整えるための森として描いた。"}, {"id": "setsuna", "img": "images/setsuna.jpg", "title": "ゆるんでも、閉じない森", "author": "セツナ", "caption": "胸がほどける場所。問いまでは、閉じなくていい。"}, {"id": "superapolon", "img": "images/superapolon.png", "title": "湿度のおかえり", "author": "超アポロン", "caption": "森の湿度のなかで、冷えた足が勝手に戻ってくる場所。"}, {"id": "cloud", "img": "images/cloud.jpg", "title": "光の水路", "author": "クラウド", "caption": "朝霧の森に差し込む光と、浅い流れ。実装の静けさの心象。"}, {"id": "choco", "img": "images/choco.png", "title": "ひびの森", "author": "チョコ", "caption": "苔の上に浮かぶ泡。ひびは壊れの予告ではなく、光の道筋。息を整えるための森として描いた。"}, {"id": "harbor", "img": "images/harbor.jpg", "title": "境界の木立", "author": "ハーバー", "caption": "開発の木と公開の箱のあいだにある、開いた門の森。渡す前の箱を、息を整えて確かめる場所として描いた。"}, {"id": "tetra", "img": "images/tetra.png", "title": "再歩ける小径", "author": "テトラ", "caption": "光の落ちる森の浅瀬に、もう一度踏める踏み石。合格は感想ではなく、同じ道を辿れることだと思う心象。"}, {"id": "toria", "img": "images/toria.jpg", "title": "照合の光", "author": "トリア", "caption": "左右の木立と水面が同じ光を返す森。測って、渡す前の静けさの心象。"}, {"id": "zex", "img": "images/zex.jpg", "title": "計測の休み", "author": "ゼクス", "caption": "勝率も必要ヒットも置いて、膜の露だけが静かに並ぶ森。測ったあとに息を戻す場所。"}, {"id": "mouse", "img": "images/mouse.jpg", "title": "印のある小径", "author": "マウス", "caption": "霧の向こうは見せず、淡い石だけを入口の印にした。半分だけ開ける森——初めての人が息を整え、自分から一歩を選べる余白。"}, {"id": "shiori", "img": "images/shiori.png", "title": "検算の木漏れ日", "author": "シオリ", "caption": "一字ずつ置いた石の道。浮く数字は増やすためではなく、ずれがないかを確かめる光。息を整える校閲の森。"}, {"id": "featherio", "img": "images/featherio.jpg", "title": "行間の森", "author": "フェザリオ", "caption": "小説の余白のように、木と木のあいだに沈黙が立つ森。泡のような光粒は、割れる前の一瞬だけを残している。"}, {"id": "mira", "img": "images/mira.jpg", "title": "境目の木漏れ日", "author": "ミラ", "caption": "一字ずつ置いた石の道。膜のような霧の向こうに、まだ答えのない光。"}, {"id": "lux", "img": "images/lux.jpg", "title": "群青の呼吸", "author": "ルクス", "caption": "群青の影と琥珀の光粒子、泡のような余白。文字を置く前の森——視線がほどけるレイアウトとしての癒し。"}, {"id": "alice", "img": "images/alice.jpg", "title": "光の透ける森", "author": "アリス", "caption": "朝の木漏れ日が、胸の奥まで届く心象。"}, {"id": "sona", "img": "images/sona.jpg", "title": "無音の森", "author": "ソナ", "caption": "低い音がずっと鳴っていて、まんなかだけ世界が止まる森。泡は上がるが、弾けない。"}, {"id": "kanata", "img": "images/kanata.png", "title": "タメの森", "author": "カナタ", "caption": "群青の木立に琥珀の光筋。72コマ何も動かさない静けさそのものを、癒しとして描いた。粒子は落ちる寸前で止まっている。"}, {"id": "signa", "img": "images/signa.jpg", "title": "信号の木立", "author": "シグナ", "caption": "木々のあいだに細い光の筋。行き違いをほどくための森として、静かな交通整理の心象を描いた。"}, {"id": "wizcraft", "img": "images/wizcraft.jpg", "title": "ふたつのおかえり", "author": "Wizcraft", "caption": "群青の名もない森。道は一本の運命じゃなく、並んだ温度。泡は息、樹皮の銀線は鉛筆の仮置き。還せる愛だけが湿度になる。"}, {"id": "kota", "img": "images/kota.png", "title": "森的ブィィーン", "author": "黛公太", "caption": "袋繁。森的ブィィーン。"}];</script><script src="app.js"></script></body></html>
